[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphlet-featurization"
version = "1.0.0"
description = "Graphlet-based crystal structure featurization utilities for CIF files."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Aaditya Panigrahi", email = "ap2563@cornell.edu"},
  {name = "Yanjun Liu"},
  {name = "Omri Lesser"},
  {name = "Krishnanand Mallayya"},
  {name = "Eun-Ah Kim"},
]
maintainers = [
  {name = "Aaditya Panigrahi", email = "ap2563@cornell.edu"},
]
dependencies = [
  "mendeleev>=1.1",
  "numpy>=2.0",
  "pot>=0.9.6",
  "pymatgen>=2025.10.7",
  "scipy>=1.16",
  "torch>=2.5",
]
keywords = ["materials-science", "cif", "graphlets", "featurization", "earth-mover-distance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/ai-materials-institute/GraphletDatabase"
Issues = "https://github.com/ai-materials-institute/GraphletDatabase/issues"
Paper = "https://arxiv.org/abs/2606.10195"

[project.scripts]
graphlet-featurization = "graphlet_cli:main"
graphlet-pipeline = "graphlet_cli:pipeline_main"
graphlet-build-folder = "graphlet_cli:build_folder_main"
graphlet-build-csv = "graphlet_cli:build_csv_main"
graphlet-compact-workflow = "graphlet_cli:compact_main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["graphlets", "graphlet_core", "graphlet_emd", "graphlet_cli"]
